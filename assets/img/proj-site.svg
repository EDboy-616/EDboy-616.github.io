.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#ffffff;fill-opacity:.7;stroke:#1a1916;stroke-opacity:.4;stroke-width:1}
