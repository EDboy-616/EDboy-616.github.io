<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="768" height="960" role="img" aria-label="本站卡面：暖白编辑式页面结构线框，手写 HTML 无构建">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#fafaf7}
.grid{stroke:#1a1916;stroke-opacity:.05;fill:none}
