<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" role="img" aria-label="板块图：闸门开合两态对照">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#f4edda}
.grid{stroke:#15140f;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#15140f;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#15140f;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#15140f;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#b4462f;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#15140f}
.fill-i-soft{fill:#15140f;fill-opacity:.5}
.fill-c{fill:#b4462f}
.fill-c-soft{fill:#b4462f;fill-opacity:.12}
.tx-i{fill:#15140f}
.tx-m{fill:#5a5448}
.tx-c{fill:#b4462f}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#faf5e6;fill-opacity:.7;stroke:#15140f;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#faf5e6;fill-opacity:.7;stroke:#b4462f;stroke-opacity:.55;stroke-width:1}
.bar{fill:#15140f;fill-opacity:.16}
.bar-c{fill:#b4462f;fill-opacity:.28}
.chip{fill:#15140f;fill-opacity:.85}
.chip-tx{fill:#f4edda}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
<rect width="400" height="300" class="paper"/><rect width="400" height="300" fill="url(#g)"/>
<g class="frame"><path d="M16 34V16H34"/><path d="M366 16H384V34"/><path d="M16 266V284H34"/><path d="M366 284H384V266"/></g>
<text x="24" y="30" class="mono tx-i">PL. 12 / THE GATE</text><text x="24" y="45" class="mono tx-m">闸门两态 · 不做什么</text>
<rect x="42" y="90" width="140" height="150" class="card"/>
<path class="ln-c" d="M42 240h140M60 240V90M164 240V90"/>
<path class="ln-c dash" d="M112 90v150"/>
<text x="62" y="118" class="mono tx-c">闸门合</text>
<text x="62" y="140" class="mono tx-m">数字没来源</text>
<text x="62" y="156" class="mono tx-m">不上日报</text>
<text x="62" y="180" class="mono tx-m">没有可靠信号</text>
<text x="62" y="196" class="mono tx-m">就不做提醒</text>
<circle cx="158" cy="222" r="10" class="ln-c"/><path class="ln-c" d="M151 222h14"/>
<rect x="218" y="90" width="140" height="150" class="card"/>
<path class="ln" d="M218 240h140M236 240V90M340 240V120"/>
<path class="ln-c" d="M340 120a20 20 0 0 1 0-30" transform="translate(0,0)"/>
<text x="238" y="118" class="mono tx-i">闸门开</text>
<text x="238" y="140" class="mono tx-m">标准库取到数</text>
<text x="238" y="156" class="mono tx-m">→ 进速览条</text>
<text x="238" y="180" class="mono tx-m">≥2 权威源一致</text>
<text x="238" y="196" class="mono tx-m">→ 进要闻段</text>
<circle cx="334" cy="222" r="10" class="ln"/><path class="ln-c" d="M329 222l4 4 7-8"/>
<text x="24" y="278" class="mono tx-m">边界比功能更能说明它是什么</text>
</svg>
