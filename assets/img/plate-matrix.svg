.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#ffffff;fill-opacity:.7;stroke:#1a1916;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#ffffff;fill-opacity:.7;stroke:#a34c33;stroke-opacity:.55;stroke-width:1}
.bar{fill:#1a1916;fill-opacity:.16}
.bar-c{fill:#a34c33;fill-opacity:.28}
.chip{fill:#1a1916;fill-opacity:.85}
.chip-tx{fill:#fafaf7}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
