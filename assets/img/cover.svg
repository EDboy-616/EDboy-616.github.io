<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="1024" height="1024" role="img" aria-label="工作台剖面图纸：笔电出码、手机记账、竖长日报、钥匙，本机离线可交接">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#f4edda}
.grid{stroke:#15140f;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#15140f;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#15140f;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#15140f;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#b4462f;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#15140f}
.fill-i-soft{fill:#15140f;fill-opacity:.5}
.fill-c{fill:#b4462f}
.fill-c-soft{fill:#b4462f;fill-opacity:.12}
.tx-i{fill:#15140f}
.tx-m{fill:#5a5448}
.tx-c{fill:#b4462f}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#faf5e6;fill-opacity:.7;stroke:#15140f;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#faf5e6;fill-opacity:.7;stroke:#b4462f;stroke-opacity:.55;stroke-width:1}
.bar{fill:#15140f;fill-opacity:.16}
.bar-c{fill:#b4462f;fill-opacity:.28}
.chip{fill:#15140f;fill-opacity:.85}
.chip-tx{fill:#f4edda}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
<rect width="400" height="400" class="paper"/><rect width="400" height="400" fill="url(#g)"/>
<g class="frame"><path d="M16 34V16H34"/><path d="M366 16H384V34"/><path d="M16 366V384H34"/><path d="M366 384H384V366"/></g>
<text x="24" y="30" class="mono tx-i">PL. 01 / LOCAL FIRST</text><text x="24" y="45" class="mono tx-m">工作台剖面</text>
<rect x="70" y="72" width="150" height="92" rx="3" class="card"/>
<path class="ln" d="M60 164h170l8 14H52z"/>
<text x="82" y="88" class="mono tx-c">$ local-first</text>
<path class="ln-soft" d="M82 102h96M82 112h72M82 122h104M82 132h58"/>
<circle cx="96" cy="148" r="5" class="fill-c"/><text x="106" y="151" class="mono tx-m">离线运行</text>
<rect x="248" y="64" width="84" height="152" rx="9" class="card-c"/>
<path class="ln-soft" d="M260 92h60M260 108h48M260 124h56"/>
<path class="ln" d="M260 80h24"/>
<circle cx="290" cy="166" r="16" class="ln"/><path class="ln-c" d="M290 166V150A16 16 0 0 1 305.6 161z"/>
<rect x="268" y="200" width="44" height="4" rx="2" class="fill-c"/>
<rect x="96" y="196" width="124" height="152" class="card"/>
<path class="bar" d="M96 196h124v18H96z"/>
<text x="104" y="209" class="mono tx-i">DAILY</text>
<text x="104" y="230" class="mono-l tx-i">金融日报</text>
<path class="ln-soft" d="M104 242h108M104 250h108M104 258h78"/>
<rect x="104" y="268" width="48" height="26" class="bar-c"/><rect x="160" y="268" width="48" height="26" class="bar"/>
<rect x="104" y="302" width="104" height="30" class="ln-soft" fill="none"/>
<text x="110" y="320" class="mono tx-m">13 板块</text>
<g class="ln"><circle cx="262" cy="320" r="11"/><path d="M271 329l14 14M279 337l5-5M285 343l5-5"/></g>
<text x="248" y="292" class="mono tx-c">6 位码</text>
<rect x="248" y="296" width="26" height="14" class="card"/><rect x="278" y="296" width="26" height="14" class="card"/>
<text x="30" y="378" class="mono tx-m">本机 · 离线 · 可交接</text>
<text x="376" y="378" class="mono tx-m" text-anchor="end">LOCAL FIRST</text>
</svg>
