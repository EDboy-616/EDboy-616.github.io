<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="1024" height="1024" role="img" aria-label="技术图纸：阅读顺序，方向、位置、仓位，真实行情">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#f4edda}
.grid{stroke:#15140f;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#15140f;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#15140f;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#15140f;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#b4462f;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#15140f}
.fill-i-soft{fill:#15140f;fill-opacity:.5}
.fill-c{fill:#b4462f}
.fill-c-soft{fill:#b4462f;fill-opacity:.12}
.tx-i{fill:#15140f}
.tx-m{fill:#5a5448}
.tx-c{fill:#b4462f}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.wick{stroke:#15140f;stroke-opacity:.55;stroke-width:.8;fill:none}
.cnd-up{fill:#f4edda;stroke:#15140f;stroke-opacity:.72;stroke-width:.8}
.cnd-dn{fill:#15140f;fill-opacity:.8;stroke:#15140f;stroke-opacity:.8;stroke-width:.8}
.ma1{fill:none;stroke:#b4462f;stroke-width:1.2}
.ma2{fill:none;stroke:#15140f;stroke-opacity:.52;stroke-width:1}
.ma3{fill:none;stroke:#15140f;stroke-opacity:.34;stroke-width:1;stroke-dasharray:4 3}
.guide{fill:none;stroke:#b4462f;stroke-opacity:.42;stroke-width:.8;stroke-dasharray:2 4}
.mark-c{fill:#f4edda;stroke:#b4462f;stroke-width:1.3}
@media (prefers-color-scheme: dark){
.paper{fill:#14120e}
.grid{stroke:#eae2d0;stroke-opacity:.06}
.frame{stroke:#eae2d0;stroke-opacity:.55}
.ln{stroke:#eae2d0;stroke-opacity:.8}
.ln-soft{stroke:#eae2d0;stroke-opacity:.4}
.ln-c{stroke:#e07a63}
.fill-i{fill:#eae2d0}
.fill-i-soft{fill:#eae2d0;fill-opacity:.55}
.fill-c{fill:#e07a63}
.fill-c-soft{fill:#e07a63;fill-opacity:.14}
.tx-i{fill:#eae2d0}
.tx-m{fill:#aaa08c}
.tx-c{fill:#e07a63}
.wick{stroke:#eae2d0}
.cnd-up{fill:#14120e;stroke:#eae2d0;stroke-opacity:.72}
.cnd-dn{fill:#eae2d0;fill-opacity:.8;stroke:#eae2d0;stroke-opacity:.8}
.ma1{stroke:#e07a63}
.ma2{stroke:#eae2d0;stroke-opacity:.52}
.ma3{stroke:#eae2d0;stroke-opacity:.34}
.guide{stroke:#e07a63;stroke-opacity:.45}
.mark-c{fill:#14120e;stroke:#e07a63}
}

.ring{fill:none;stroke:#b4462f;stroke-width:1;opacity:0}
@media (prefers-color-scheme: dark){.ring{stroke:#e07a63}}
.anim-scan{opacity:0}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.anim-draw{animation:adraw 1.4s cubic-bezier(.35,0,.2,1) both}
.anim-pop{transform-box:fill-box;transform-origin:center;animation:apop .7s cubic-bezier(.3,1.3,.5,1) both}
.anim-grow-y{transform-box:fill-box;transform-origin:bottom;animation:agrowy .9s cubic-bezier(.3,0,.2,1) both}
.anim-grow-c{transform-box:fill-box;transform-origin:center;animation:agrowy .55s cubic-bezier(.3,0,.2,1) both}
.anim-grow-x{transform-box:fill-box;transform-origin:left;animation:agrowx .8s cubic-bezier(.3,0,.2,1) both}
.anim-ring{transform-box:fill-box;transform-origin:center;animation:aring 2.8s ease-out infinite}
.anim-breathe{animation:abreathe 6s ease-in-out infinite}
.anim-scan{animation:ascan 8s linear infinite}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
.d5{animation-delay:.70s}
.d6{animation-delay:.84s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
@keyframes adraw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes apop{0%{transform:scale(.35);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes agrowy{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
@keyframes agrowx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes aring{0%{transform:scale(.55);opacity:.6}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes abreathe{0%,100%{opacity:.82}50%{opacity:.32}}
@keyframes ascan{0%{transform:translateX(0);opacity:0}8%{opacity:.42}90%{opacity:.42}100%{transform:translateX(var(--dx,284px));opacity:0}}
</style>
