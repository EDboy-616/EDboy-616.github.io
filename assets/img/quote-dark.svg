<path class="ln-soft anim-grow-c" style="animation-delay:0.52s" d="M230 206V214"/>
<path class="ln-c anim-grow-c" style="animation-delay:0.56s" d="M245 201V219"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.59s" d="M260 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.62s" d="M275 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.66s" d="M290 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.70s" d="M305 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.73s" d="M320 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.77s" d="M335 206V214"/>
<path class="ln-soft anim-grow-c" style="animation-delay:0.80s" d="M350 206V214"/>
<g class="anim-fade d3"><g class="ln-soft"><path class="dash" d="M50 186H350"/><path d="M50 182V190M350 182V190"/></g><text x="200.0" y="179" class="mono tx-m" text-anchor="middle">21 次执行 / 21 EXECUTIONS</text></g>
<text x="50" y="232" class="mono tx-m">一次执行 = 一根刻线 / ONE TICK</text>
<g class="anim-fade d4"><path class="ln-c dash anim-breathe" d="M245 222V300"/></g>
<text x="245" y="316" class="mono tx-c" text-anchor="middle">第 14 次，仍然照做</text>
<text x="50" y="350" class="mono tx-m">规则不变，动作不变 / SAME RULE, SAME ACTION</text>
<text x="24" y="376" class="mono tx-m">把同一条规则执行很多次 / SAME RULE, MANY TIMES</text>
</svg>
