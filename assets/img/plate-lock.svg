<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" role="img" aria-label="板块图：口令派生与原子落盘示意">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#f4edda}
.grid{stroke:#15140f;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#15140f;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#15140f;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#15140f;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#b4462f;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#15140f}
.fill-i-soft{fill:#15140f;fill-opacity:.5}
.fill-c{fill:#b4462f}
.fill-c-soft{fill:#b4462f;fill-opacity:.12}
.tx-i{fill:#15140f}
.tx-m{fill:#5a5448}
.tx-c{fill:#b4462f}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#faf5e6;fill-opacity:.7;stroke:#15140f;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#faf5e6;fill-opacity:.7;stroke:#b4462f;stroke-opacity:.55;stroke-width:1}
.bar{fill:#15140f;fill-opacity:.16}
.bar-c{fill:#b4462f;fill-opacity:.28}
.chip{fill:#15140f;fill-opacity:.85}
.chip-tx{fill:#f4edda}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
<rect width="400" height="300" class="paper"/><rect width="400" height="300" fill="url(#g)"/>
<g class="frame"><path d="M16 34V16H34"/><path d="M366 16H384V34"/><path d="M16 266V284H34"/><path d="M366 284H384V266"/></g>
<text x="24" y="30" class="mono tx-i">PL. 10 / ATOMIC WRITE</text><text x="24" y="45" class="mono tx-m">口令派生与原子落盘</text>
<rect x="34" y="110" width="92" height="42" rx="4" class="card"/>
<text x="44" y="128" class="mono tx-i">口令</text>
<path class="fill-i-soft" d="M44 138h6v6h-6zM54 138h6v6h-6zM64 138h6v6h-6zM74 138h6v6h-6zM84 138h6v6h-6z"/>
<path class="ln-c" d="M126 131h30M156 127l5 4-5 4"/>
<rect x="156" y="110" width="72" height="42" rx="4" class="card-c"/>
<text x="166" y="128" class="mono tx-c">scrypt</text>
<text x="166" y="144" class="mono tx-m">+ AES</text>
<path class="ln-c" d="M228 131h30M258 127l5 4-5 4"/>
<rect x="258" y="104" width="108" height="54" rx="4" class="card"/>
<text x="268" y="122" class="mono tx-i">密钥</text>
<path class="ln-soft" d="M268 132h88M268 142h64"/>
<rect x="60" y="200" width="84" height="48" rx="4" class="card"/>
<text x="70" y="220" class="mono tx-m">写临时文件</text>
<text x="70" y="236" class="mono tx-m">*.tmp</text>
<path class="ln-c" d="M144 224h44M188 220l5 4-5 4"/>
<rect x="188" y="200" width="60" height="48" rx="4" class="card-c"/>
<text x="196" y="228" class="mono tx-c">rename</text>
<path class="ln-c" d="M248 224h36M284 220l5 4-5 4"/>
<rect x="284" y="200" width="76" height="48" rx="4" class="card"/>
<text x="294" y="220" class="mono tx-i">数据文件</text>
<text x="294" y="236" class="mono tx-m">本机落盘</text>
<text x="24" y="284" class="mono tx-m">要么写全，要么不写 / NO PARTIAL WRITE</text>
</svg>
