<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" role="img" aria-label="板块图：取数到校验到成稿的三关管线">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#f4edda}
.grid{stroke:#15140f;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#15140f;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#15140f;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#15140f;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#b4462f;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#15140f}
.fill-i-soft{fill:#15140f;fill-opacity:.5}
.fill-c{fill:#b4462f}
.fill-c-soft{fill:#b4462f;fill-opacity:.12}
.tx-i{fill:#15140f}
.tx-m{fill:#5a5448}
.tx-c{fill:#b4462f}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#faf5e6;fill-opacity:.7;stroke:#15140f;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#faf5e6;fill-opacity:.7;stroke:#b4462f;stroke-opacity:.55;stroke-width:1}
.bar{fill:#15140f;fill-opacity:.16}
.bar-c{fill:#b4462f;fill-opacity:.28}
.chip{fill:#15140f;fill-opacity:.85}
.chip-tx{fill:#f4edda}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
<rect width="400" height="300" class="paper"/><rect width="400" height="300" fill="url(#g)"/>
<g class="frame"><path d="M16 34V16H34"/><path d="M366 16H384V34"/><path d="M16 266V284H34"/><path d="M366 284H384V266"/></g>
<text x="24" y="30" class="mono tx-i">PL. 09 / PIPELINE</text><text x="24" y="45" class="mono tx-m">取数 → 校验 → 成稿</text>
<rect x="50" y="120" width="64" height="64" rx="5" class="card"/>
<text x="82" y="190" class="mono tx-c" text-anchor="middle">取数</text>
<text x="82" y="112" class="mono tx-m" text-anchor="middle">01</text>
<path class="ln" d="M116 152h44M156 148l5 4-5 4"/>
<rect x="168" y="120" width="64" height="64" rx="5" class="card-c"/>
<text x="200" y="190" class="mono tx-c" text-anchor="middle">校验</text>
<text x="200" y="112" class="mono tx-m" text-anchor="middle">02</text>
<path class="ln" d="M234 152h44M274 148l5 4-5 4"/>
<rect x="286" y="120" width="64" height="64" rx="5" class="card"/>
<text x="318" y="190" class="mono tx-c" text-anchor="middle">成稿</text>
<text x="318" y="112" class="mono tx-m" text-anchor="middle">03</text>
<rect x="42" y="214" width="80" height="44" rx="4" class="card"/>
<text x="52" y="232" class="mono tx-m">标准库脚本</text>
<text x="52" y="248" class="mono tx-m">公开行情取数</text>
<rect x="160" y="214" width="80" height="44" rx="4" class="card"/>
<text x="170" y="232" class="mono tx-c">取不到 → 撤下</text>
<text x="170" y="248" class="mono tx-m">标「待核」</text>
<rect x="278" y="214" width="80" height="44" rx="4" class="card"/>
<text x="288" y="232" class="mono tx-m">HTML 必交</text>
<text x="288" y="248" class="mono tx-m">3x PNG 可选</text>
<path class="ln-soft dash" d="M82 184v30M200 184v30M318 184v30"/>
<text x="24" y="284" class="mono tx-i">每个数字都要能指回来源</text>
</svg>
