<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="1024" height="1024" role="img" aria-label="关于区图纸：三个身份收敛成一条工作流">
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20"/></pattern></defs>
<style>
.paper{fill:#fafaf7}
.grid{stroke:#1a1916;stroke-opacity:.05;fill:none}
.frame{fill:none;stroke:#1a1916;stroke-opacity:.55;stroke-width:1}
.ln{fill:none;stroke:#1a1916;stroke-opacity:.8;stroke-width:1.1}
.ln-soft{fill:none;stroke:#1a1916;stroke-opacity:.36;stroke-width:.9}
.ln-c{fill:none;stroke:#a34c33;stroke-width:1.5}
.dash{stroke-dasharray:3 5}
.fill-i{fill:#1a1916}
.fill-i-soft{fill:#1a1916;fill-opacity:.5}
.fill-c{fill:#a34c33}
.fill-c-soft{fill:#a34c33;fill-opacity:.12}
.tx-i{fill:#1a1916}
.tx-m{fill:#6b6964}
.tx-c{fill:#a34c33}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.09em}
.mono-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em}
.serif{font-family:Georgia,'Songti SC','SimSun',serif}
.card{fill:#ffffff;fill-opacity:.7;stroke:#1a1916;stroke-opacity:.4;stroke-width:1}
.card-c{fill:#ffffff;fill-opacity:.7;stroke:#a34c33;stroke-opacity:.55;stroke-width:1}
.bar{fill:#1a1916;fill-opacity:.16}
.bar-c{fill:#a34c33;fill-opacity:.28}
.chip{fill:#1a1916;fill-opacity:.85}
.chip-tx{fill:#fafaf7}
@media (prefers-reduced-motion: no-preference){
.anim-fade{animation:afade .8s ease both}
.d1{animation-delay:.14s}
.d2{animation-delay:.28s}
.d3{animation-delay:.42s}
.d4{animation-delay:.56s}
}
@keyframes afade{from{opacity:0}to{opacity:1}}
</style>
<rect width="400" height="400" class="paper"/><rect width="400" height="400" fill="url(#g)"/>
<g class="frame"><path d="M16 34V16H34"/><path d="M366 16H384V34"/><path d="M16 366V384H34"/><path d="M366 384H384V366"/></g>
<text x="24" y="30" class="mono tx-i">PL. 07 / THE BENCH</text><text x="24" y="45" class="mono tx-m">赵耀 · 三个身份一条线</text>
<rect x="30" y="58" width="110" height="42" rx="4" class="card"/>
<text x="44" y="84" class="mono tx-i">券商理财顾问</text>
<path class="ln-c dash" d="M140 84h40"/>
<rect x="30" y="124" width="110" height="42" rx="4" class="card"/>
<text x="44" y="150" class="mono tx-i">独立交易者</text>
<path class="ln-c dash" d="M140 150h40"/>
<rect x="30" y="190" width="110" height="42" rx="4" class="card"/>
<text x="44" y="216" class="mono tx-i">自研工程者</text>
<path class="ln-c dash" d="M140 216h40"/>
<path class="ln-c" d="M180 84v132"/>
<path class="ln-c dash" d="M180 150h30"/>
<rect x="182" y="130" width="56" height="40" rx="4" class="card-c"/>
<text x="210" y="155" class="mono tx-c" text-anchor="middle">判断</text>
<rect x="244" y="130" width="56" height="40" rx="4" class="card-c"/>
<text x="272" y="155" class="mono tx-c" text-anchor="middle">转译</text>
<rect x="306" y="130" width="56" height="40" rx="4" class="card-c"/>
<text x="334" y="155" class="mono tx-c" text-anchor="middle">凭证</text>
<path class="ln" d="M242 150h24M260 146l6 4-6 4"/>
<path class="ln" d="M304 150h24M322 146l6 4-6 4"/>
<rect x="120" y="240" width="180" height="90" rx="6" class="card"/>
<text x="134" y="264" class="mono tx-m">产出</text>
<path class="bar" d="M134 276h152v6h-152zM134 292h120v6h-120zM134 308h140v6h-140z"/>
<path class="ln-c dash" d="M210 220V240"/>
<text x="24" y="376" class="mono tx-i">缺口：把判断转译成凭证</text>
</svg>
