      <h1 class="article-title">关于</h1>

      <p>这一页是给人看你的。想清楚三件事就够了：你是谁（或者用什么名字出现）、这里会写什么、怎么联系你。</p>

      <h2>这里写什么</h2>

      <p>替换成你自己的说法。一句人话比一段自我介绍有用。</p>

      <h2>联系我</h2>

      <p>留一个就够了，邮箱、Telegram、或者某个平台的账号。写邮箱时注意它会被爬虫抓走，如果你不想收垃圾邮件，可以写成「myname 加上 @ 和 gmail 点 com」这种读得懂但抓不走的形式。</p>

      <h2>关于这个站</h2>
