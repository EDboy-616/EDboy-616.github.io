<!doctype html>
<html lang="zh-CN" data-zcode-design>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf7" />
  <meta name="robots" content="noindex" />
  <title>页面不存在 · 某某的博客</title>
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --fg: #1a1916;
      --muted: #6b6964;
      --border: #e8e5df;
      --border-strong: #8a867e;
      --accent: #a34c33;
      --on-accent: #ffffff;
      --font-display: "Iowan Old Style", "Charter", Georgia, "Songti SC", "Noto Serif SC", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      --container: 1120px;
      --gutter: 32px;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .topnav { border-bottom: 1px solid var(--border); }
    .topnav-inner { display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 20px; }
    .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
    main { display: grid; min-height: calc(100vh - 145px); place-items: center; padding: 64px 0; text-align: center; }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { max-width: 18ch; margin: 0 auto; font-family: var(--font-display); font-size: clamp(44px, 7vw, 76px); font-weight: 500; letter-spacing: -.02em; line-height: 1.04; }
    .lead { max-width: 46ch; margin: 24px auto 0; color: var(--muted); font-size: 19px; }
    .btn { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 32px; padding: 11px 20px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
    .btn:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .pagefoot { padding-block: 28px; border-top: 1px solid var(--border); color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
    @media (max-width: 640px) { :root { --gutter: 20px; } }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="logo" href="/">某某的博客</a>
      <a href="/">返回首页</a>
    </div>
  </header>
  <main id="content">
    <div class="container">
      <p class="eyebrow">404 / Not Found</p>
      <h1>这一页不在这里。</h1>
      <p class="lead">链接可能写错了，也可能页面已经移动。回到首页继续看。</p>
      <a class="btn" href="/">返回首页 →</a>
    </div>
  </main>
  <footer class="pagefoot">
    <div class="container">© 2026 某某的博客</div>
  </footer>
</body>
</html>
