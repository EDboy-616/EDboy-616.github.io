<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <title>页面不存在 · ED boy · 个人博客</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='15' fill='%23fff' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M18 18h17v5h-11v6h9v5h-9v7h11v5H18z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' d='M38 18h5c7 0 11 5 11 14s-4 14-11 14h-5V18zm5 6v16h1c4 0 6-3 6-8s-2-8-6-8h-1z' fill='%23000'/%3E%3Ccircle cx='32' cy='4' r='3' fill='%23000'/%3E%3Ccircle cx='32' cy='60' r='2' fill='%23737373'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --fg: #000000;
      --fg-2: #262626;
      --muted: #737373;
      --meta: #a3a3a3;
      --border: #e5e5e5;
      --accent: #000000;
      --accent-on: #ffffff;
      --font-display: "SF Pro Rounded", system-ui, -apple-system, system-ui;
      --font-body: ui-sans-serif, system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --radius-md: 12px;
      --radius-pill: 9999px;
      --container-max: 1280px;
      --container-gutter-desktop: 24px;
      --container-gutter-tablet: 16px;
      --container-gutter-phone: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    .site-blueprint {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px),
        radial-gradient(circle, var(--meta) .7px, transparent .8px);
      background-size: 32px 32px, 32px 32px, 32px 32px;
      background-position: -1px -1px, -1px -1px, 15px 15px;
      opacity: .22;
      mask-image: linear-gradient(to bottom, var(--fg), transparent 88%);
      -webkit-mask-image: linear-gradient(to bottom, var(--fg), transparent 88%);
    }
    .container {
      position: relative; z-index: 1;
      width: min(var(--container-max), 100%);
      margin-inline: auto;
      padding-inline: var(--container-gutter-desktop);
    }
    .site-header { border-block-end: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); }
    .nav-wrap { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
    .brand { display: inline-flex; align-items: center; gap: var(--space-3); text-decoration: none; }
    .brand-symbol { width: 44px; height: 44px; display: grid; place-items: center; }
    .brand-symbol svg { width: 44px; height: 44px; overflow: visible; }
    .brand-plate { fill: var(--bg); stroke: var(--fg); stroke-width: .9; }
    .brand-glyph { fill: var(--fg); }
    .brand-wordmark { display: grid; gap: 6px; min-width: 72px; }
    .wordmark-main { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
    .wordmark-main strong { font-family: var(--font-display); font-size: 18px; font-weight: 500; letter-spacing: -.045em; }
    .wordmark-main > span { color: var(--muted); font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: lowercase; }
    .nav-link {
      padding: 8px var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-pill);
      font-size: var(--text-sm); text-decoration: none; transition: background-color 100ms, border-color 100ms;
    }
    .nav-link:hover { background: var(--surface); border-color: var(--fg); }
    main { position: relative; z-index: 1; display: grid; place-items: center; padding-block: clamp(64px, 12vw, 144px); }
    .error-content { width: min(720px, 100%); }
    .eyebrow {
      display: flex; align-items: center; gap: var(--space-2);
      color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg); }
    h1 {
      max-width: 14ch; margin: var(--space-6) 0 0;
      font-family: var(--font-display); font-size: clamp(40px, 7vw, 64px);
      font-weight: 500; line-height: 1.06; letter-spacing: -.03em;
    }
    .lead { max-width: 46ch; margin-block-start: var(--space-6); color: var(--muted); font-size: var(--text-lg); line-height: 1.7; }
    .error-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-block-start: var(--space-8); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      min-height: 44px; padding: 10px var(--space-6); border: 1px solid transparent;
      border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: 500;
      line-height: 1; text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
    .btn-primary:hover { background: var(--fg-2); border-color: var(--fg-2); }
    .btn-outline { background: var(--bg); color: var(--fg-2); border-color: var(--border); }
    .btn-outline:hover { background: var(--surface); border-color: var(--fg); }
    a:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklab, #3b82f6, transparent 50%); }
    .site-footer {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-3);
      padding-block: var(--space-6); border-block-start: 1px solid var(--border);
      color: var(--muted); font-family: var(--font-mono); font-size: 12px;
    }
    @media (max-width: 1023px) { .container { padding-inline: var(--container-gutter-tablet); } }
    @media (max-width: 767px) {
      .container { padding-inline: var(--container-gutter-phone); }
      .nav-wrap { min-height: 68px; }
      .brand-wordmark { display: none; }
      .lead { font-size: var(--text-base); }
    }
  </style>
</head>
<body>
  <div class="site-blueprint" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/" aria-label="ED boy 个人博客首页">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 48 48" shape-rendering="geometricPrecision">
            <rect class="brand-plate" x="4" y="4" width="40" height="40" rx="12" />
            <path class="brand-glyph" d="M12 15h12v3.6h-8.2v4.6h7.2v3.6h-7.2v4.6h8.4V35H12z" />
            <path class="brand-glyph" fill-rule="evenodd" d="M27 15h3.4c5.2 0 8.2 3.9 8.2 10s-3 10-8.2 10H27V15zm3.4 3.7v12.6h.6c3.1 0 4.7-2.5 4.7-6.3s-1.6-6.3-4.7-6.3h-.6z" />
          </svg>
        </span>
        <span class="brand-wordmark">
          <span class="wordmark-main"><strong>notes</strong><span>build</span></span>
        </span>
      </a>
      <a class="nav-link" href="/">返回首页</a>
    </div>
  </header>
  <main id="main">
    <div class="container error-content">
      <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span>404 / NOT FOUND</p>
      <h1>这一页不在这里。</h1>
      <p class="lead">链接可能写错了，也可能页面已经移动。回到首页继续看。</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">返回首页 <span aria-hidden="true">→</span></a>
        <a class="btn btn-outline" href="https://github.com/EDboy-616" target="_blank" rel="noreferrer">访问 GitHub</a>
      </div>
    </div>
  </main>
  <footer class="site-footer container">
    <span>© <span id="year">2026</span> ED boy</span>
    <span>用代码构建，用文字解释。</span>
  </footer>
</body>
</html>
