<!doctype html>
<!-- OD web-prototype seed · 个人博客首页重构 -->
<html lang="zh-CN" data-zcode-design>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf7" />
  <meta name="description" content="某某的博客：记录、思考与项目。" />
  <title>某某的博客 · 记录与项目</title>
  <style>
    /* ─── tokens（模板原版，配色只在这里改） ─────────────────────── */
    :root {
      --bg:      #fafaf7;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #6b6964;
      --border:  #e8e5df;
      --border-strong: #8a867e;
      --on-accent: #ffffff;
      --accent:  #a34c33;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'Noto Serif SC', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      --fs-h1: clamp(44px, 6vw, 76px);
      --fs-h2: clamp(32px, 4vw, 48px);
      --fs-h3: 22px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;
      --gap-xs: 8px; --gap-sm: 12px; --gap-md: 20px; --gap-lg: 32px;
      --gap-xl: 56px; --gap-2xl: 96px;
      --container: 1120px; --gutter: 32px;
      --radius: 10px; --radius-lg: 16px;
    }

    /* ─── reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.55;
      text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── layout primitives ────────────────────────────────────── */
    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .section { padding-block: clamp(48px, 8vw, var(--gap-2xl)); }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-2-1 { grid-template-columns: 1fr; }
    }

    /* ─── type ─────────────────────────────────────────────────── */
    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--gap-md); }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }

    /* ─── chrome ───────────────────────────────────────────────── */
    .topnav { position: sticky; top: 0; z-index: 10; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { font-size: 14px; color: var(--muted); }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }

    /* ─── buttons ──────────────────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: var(--radius); border: 1px solid transparent; font-size: 15px; font-weight: 500; letter-spacing: -0.005em; transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border-strong); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }

    /* ─── card / pill / tag ────────────────────────────────────── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .tag { display: inline-flex; align-items: center; padding: 4px 10px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }

    /* ─── log row（博客列表） ───────────────────────────────────── */
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }
    .log-row .meta { color: var(--muted); }
    .log-row h3 { font-size: 19px; }
    .log-row .pull { text-align: right; }
    .log-row a:hover h3 { color: var(--accent); }

    /* ─── 博客专用：头像与头图（本地素材，保留完整比例） ─────────── */
    .content-img { display: block; max-width: 100%; height: auto; object-fit: contain; border-radius: var(--radius-lg); }
    .profile-photo { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border); }
    .hero-media { aspect-ratio: 1200 / 799; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--border); }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── 原型补全：居中 Hero 与移动端导航 ─────────────────────── */
    .hero-center { max-width: 880px; margin-inline: auto; text-align: center; }
    .hero-center .lead { margin-inline: auto; }
    .hero-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap-sm); margin-top: var(--gap-lg); }
    .topnav nav a { display: inline-flex; min-height: 44px; align-items: center; }
    .topnav .btn { min-height: 44px; }
    section[id] { scroll-margin-top: 88px; }
    @media (max-width: 640px) {
      .topnav-inner { flex-wrap: wrap; gap: 12px; }
      .topnav nav { order: 3; width: 100%; justify-content: center; gap: 24px; }
      .topnav .btn { display: none; }
    }

    /* ─── 空态 ─────────────────────────────────────────────────── */
    .empty-note { border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: var(--gap-xl) var(--gap-lg); text-align: center; color: var(--muted); }
    .empty-note .pill { margin-bottom: var(--gap-md); }
    .empty-note p { max-width: 42ch; margin: var(--gap-sm) auto 0; font-size: 15px; }

    @media (max-width: 640px) {
      .log-row { grid-template-columns: 1fr; gap: var(--gap-xs); }
      .log-row .pull { text-align: left; }
      .topnav nav { gap: var(--gap-md); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
